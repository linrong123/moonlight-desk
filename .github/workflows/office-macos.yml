name: Desk macOS
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: office-mac-${{ github.sha }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.2'
          modules: 'qtshadertools qtimageformats'
          cache: true
      - name: Tests and Apple Silicon package
        shell: bash
        run: |
          export OFFICE_QT_BIN="$(dirname "$(command -v qmake)")"
          bash office/macos/test.sh
          bash office/macos/build.sh
          python3 office/macos/smoke.py
      - uses: actions/upload-artifact@v6
        with:
          name: MoonlightDesk-macOS-arm64
          path: |
            dist/MoonlightDesk-macOS-arm64.zip
            dist/SHA256SUMS
          if-no-files-found: error
